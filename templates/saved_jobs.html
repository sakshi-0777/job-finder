{% extends 'base.html' %}
{% block content %}
<h2>Saved Jobs</h2>
<div class="jobs">
    {% for job in jobs %}
    <div class="job-card">
        <h3>{{ job.title }}</h3>
        <p>{{ job.company }} | {{ job.location }} | {{ job.job_type }}</p>
        <a href="{{ url_for('job_detail', job_id=job.id) }}">View Details</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
